<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading your Pint...</title>
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f8fafc; font-family: sans-serif; }
    .spinner { border: 4px solid #e2e8f0; border-radius: 50%; border-top: 4px solid #2563eb; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
  <script>
    // Grabs the unique customer data from your friendly GitHub URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    // Paste your live Google Script /exec link between the quotes below
    const googleScriptUrl = "https://script.google.com/a/macros/cornerstone.coop/s/AKfycbw1aoFlcIph8ZnT2Q28S0CYXz7to_moy9VxMab4id6nKIBZZPVhk0djOx82wEQOKEQCYA/exec";
    
    // Smoothly forwards the customer to the Google App to render the Golden UI
    window.onload = function() {
        if (token) {
            window.location.replace(googleScriptUrl + "?token=" + token);
        } else {
            window.location.replace(googleScriptUrl);
        }
    };
  </script>
</head>
<body>
  <div style="text-align: center;">
    <div class="spinner" style="margin: 0 auto 16px;"></div>
    <h2 style="color: #0f172a; font-size: 16px;">Loading your Matchday Pint...</h2>
  </div>
</body>
</html>
