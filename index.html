<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Footy Club | Confirm Pint</title>
  <style>
     /* Locks the page down and removes all scrolling/margins */
     body, html { 
        margin: 0; padding: 0; width: 100%; height: 100%; 
        background-color: #0f172a; overflow: hidden; 
     }
     /* Makes the Google App fill the screen invisibly */
     iframe { 
        border: none; width: 100%; height: 100%; display: block; 
     }
  </style>
</head>
<body>

  <!-- The Invisible Container -->
  <iframe id="app-frame" allowfullscreen></iframe>

  <script>
     // 1. Grab the unique token from your GitHub email link
     const params = new URLSearchParams(window.location.search);
     const token = params.get('token');
     
     // 2. PASTE YOUR /dev URL HERE 
     // (Keep the quotes. Example: "https://script.google.com/macros/s/xyz123/dev")
     const gasUrl = "https://script.google.com/a/macros/cornerstone.coop/s/AKfycbxd-NVMRwEcyoNZWo2fr6FEOsqslOGiJxdA59IPXuxH/dev"; 
     
     // 3. Inject the token into the frame silently
     const frame = document.getElementById('app-frame');
     if (token) {
         frame.src = gasUrl + "?token=" + encodeURIComponent(token);
     } else {
         frame.src = gasUrl; // Loads the error screen securely
     }
  </script>

</body>
</html>
