<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Gate Footy Club | Onboarding</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a; 
            --bg-card: rgba(30, 41, 59, 0.45); 
            --border-glass: rgba(255, 255, 255, 0.2);
            --accent-gold: #f59e0b; 
            --accent-green: #10b981; 
            --accent-red: #ef4444; 
            --text-main: #f8fafc; 
            --text-muted: #cbd5e1;
        }
        body, html { 
            margin: 0; padding: 0; background-color: var(--bg-dark); font-family: 'Inter', sans-serif; color: var(--text-main); 
            height: 100vh; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center; 
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
        }
        #dynamic-bg { position: fixed; top: -5%; left: -5%; width: 110%; height: 110%; background-image: url('https://raw.githubusercontent.com/CornerstoneCoOpApps/FootyClub/refs/heads/main/stadium-bg.jpg'); background-size: cover; background-position: center; filter: blur(14px) brightness(0.4); z-index: 1; }
        
        .global-header { position: absolute; top: 15px; left: 0; width: 100%; text-align: center; z-index: 20; }
        .global-header img { max-height: 85px; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6)); }

        #app-container { width: 100%; max-width: 420px; padding: 20px; box-sizing: border-box; position: relative; z-index: 10; margin-top: 40px; }
        .glass-card { background: var(--bg-card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border-glass); border-radius: 20px; padding: 32px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
        
        .greeting { font-size: 18px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
        .highlight { color: #fff; font-weight: 900; }
        
        .input-group { margin-bottom: 24px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: 700; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .input-field { width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 16px; font-size: 16px; color: #fff; font-family: 'Inter', sans-serif; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .input-field:focus { border-color: var(--accent-gold); }
        
        .btn-primary { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none; border-radius: 12px; padding: 18px 24px; font-size: 18px; font-weight: 900; text-transform: uppercase; width: 100%; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4); display: flex; justify-content: center; align-items: center; }
        .btn-primary:active { transform: scale(0.96); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }

        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .success-screen { display: none; text-align: center; }
        .check-circle { width: 80px; height: 80px; background: rgba(16, 185, 129, 0.15); border: 3px solid var(--accent-green); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; color: var(--accent-green); font-size: 40px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="dynamic-bg"></div>

<div class="global-header">
    <img src="https://raw.githubusercontent.com/CornerstoneCoOpApps/FootyClub/refs/heads/main/Gate%20Footy%20Club%20White.png" alt="The Gate Footy Club">
</div>

<div id="app-container">
    <div id="error-screen" class="glass-card hidden">
        <h2 style="color: #ef4444; font-weight:900; text-transform:uppercase;">Invalid Link</h2>
        <p style="color: var(--text-muted); font-size: 14px;">This registration link is missing or corrupted. Please check your email.</p>
    </div>

    <div id="onboard-screen" class="glass-card hidden">
        <div class="greeting">Hey <span id="ui-name" class="highlight">Fan</span>,<br>Welcome to the Footy Club!</div>
        
        <div class="input-group">
            <label for="team-input">Who do you support?</label>
            <input type="text" id="team-input" class="input-field" placeholder="e.g. Manchester United" autocomplete="off">
        </div>

        <button id="submit-btn" class="btn-primary" onclick="submitRegistration()">
            <div class="spinner" id="btn-spinner"></div>
            <span id="btn-text">Join The Club</span>
        </button>
    </div>

    <div id="success-screen" class="glass-card success-screen">
        <div class="check-circle">✓</div>
        <h2 style="font-weight: 900; text-transform: uppercase; margin-bottom: 12px; font-size: 28px;">You're In!</h2>
        <p style="color: var(--text-muted); font-size: 15px; line-height: 1.6; margin-bottom: 24px;">
            Your profile has been updated. Look out for exclusive <span id="success-team" class="highlight">Team</span> matchday offers!
        </p>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyOzWsRLZ_hwo9PhX30IGiZOhAXyRfHRMukBq16yyj7IzaJZH866jycQ_XaCVR2xGTy/exec"; 
    
    let payloadData = null;
    let retryCount = 0;
    const MAX_RETRIES = 3;

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('error-screen').classList.remove('hidden');
            return;
        }

        try {
            let base64 = token.replace(new RegExp("-", "g"), '+').replace(new RegExp("_", "g"), '/');
            let jsonString = decodeURIComponent(escape(atob(base64)));
            payloadData = JSON.parse(jsonString);
            
            let nameParts = String(payloadData.name || "Fan").split(' ');
            document.getElementById('ui-name').innerText = nameParts.shift();
            
            document.getElementById('onboard-screen').classList.remove('hidden');
        } catch(e) {
            document.getElementById('error-screen').classList.remove('hidden');
        }
    };

    function submitRegistration() {
        const teamInput = document.getElementById('team-input').value.trim();
        
        if (!teamInput) {
            document.getElementById('team-input').style.borderColor = "#ef4444";
            return;
        }
        document.getElementById('team-input').style.borderColor = "rgba(255,255,255,0.2)";
        document.getElementById('success-team').innerText = teamInput;

        document.getElementById('submit-btn').disabled = true;
        document.getElementById('btn-spinner').style.display = 'block';
        document.getElementById('btn-text').innerText = 'Registering...';

        retryCount = 0;
        executeJSONP(teamInput);
    }

    function executeJSONP(teamName) {
        const callbackName = 'jsonp_cb_' + new Date().getTime();
        
        const script = document.createElement('script');
        script.src = WEB_APP_URL + "?action=register" +
                     "&id=" + encodeURIComponent(payloadData.id || "") + 
                     "&email=" + encodeURIComponent(payloadData.email || "") + 
                     "&team=" + encodeURIComponent(teamName) +
                     "&cb=" + new Date().getTime() + 
                     "&callback=" + callbackName;

        window[callbackName] = function(response) {
            cleanup(script, callbackName);
            if (response && response.success) {
                showSuccess();
            } else {
                handleFailure(teamName);
            }
        };

        script.onerror = function() {
            cleanup(script, callbackName);
            handleFailure(teamName);
        };

        setTimeout(function() {
            if (window[callbackName]) {
                cleanup(script, callbackName);
                handleFailure(teamName);
            }
        }, 8000);

        document.body.appendChild(script);
    }

    function handleFailure(teamName) {
        if (retryCount < MAX_RETRIES) {
            retryCount++;
            const backoffTime = Math.pow(2, retryCount) * 1000;
            setTimeout(function() {
                executeJSONP(teamName);
            }, backoffTime);
        } else {
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('btn-spinner').style.display = 'none';
            document.getElementById('btn-text').innerText = 'Try Again';
            alert("We're experiencing high traffic. Please try clicking again.");
        }
    }

    function cleanup(scriptElement, callbackName) {
        if (scriptElement && scriptElement.parentNode) {
            scriptElement.parentNode.removeChild(scriptElement);
        }
        window[callbackName] = undefined;
    }

    function showSuccess() {
        document.getElementById('onboard-screen').classList.add('hidden');
        document.getElementById('success-screen').style.display = 'block';
    }
</script>
</body>
</html>
